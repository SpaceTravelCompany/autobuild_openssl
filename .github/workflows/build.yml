name: Build Libraries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENSSL_VERSION_CURRENT: '4.0.0'
  OPENSSL_VERSION_LTS: '3.5.6'

jobs:
  build-libraries-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Clang/LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
        env: true
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: ilammy/setup-nasm@v1

    - name: Download OpenSSL sources
      uses: ./.github/actions/download-openssl
      with:
        openssl_version: ${{ env.OPENSSL_VERSION_CURRENT }}
        openssl_url: https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION_CURRENT }}/openssl-${{ env.OPENSSL_VERSION_CURRENT }}.tar.gz

    - name: Download OpenSSL LTS source
      uses: ./.github/actions/download-openssl
      with:
        openssl_version: ${{ env.OPENSSL_VERSION_LTS }}
        openssl_url: https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION_LTS }}/openssl-${{ env.OPENSSL_VERSION_LTS }}.tar.gz

    - name: Build & Install OpenSSL (Windows x64)
      shell: bash
      run: |
        set -euo pipefail
        # Git Bash prepends MSYS perl; OpenSSL VC-* targets need Strawberry Perl.
        export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
        perl -MLocale::Maketext::Simple -e '1' >/dev/null
        versions=("${{ env.OPENSSL_VERSION_CURRENT }}" "${{ env.OPENSSL_VERSION_LTS }}")
        for ver in "${versions[@]}"; do
          cd "openssl-${ver}"
          export CC=clang-cl
          perl Configure VC-WIN64A no-shared no-legacy --release //MT \
            --prefix="${GITHUB_WORKSPACE}/install/${ver}/windows/x64"
          nmake
          : > ossl_static.pdb
          nmake install_sw
          nmake clean
          cd ..
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libraries-windows
        path: install/**
        retention-days: 7

  build-libraries-windows-arm64:
    runs-on: windows-11-arm

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Clang/LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
        env: true
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64_arm64
    - uses: ilammy/setup-nasm@v1

    - name: Download OpenSSL sources
      uses: ./.github/actions/download-openssl
      with:
        openssl_version: ${{ env.OPENSSL_VERSION_CURRENT }}
        openssl_url: https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION_CURRENT }}/openssl-${{ env.OPENSSL_VERSION_CURRENT }}.tar.gz

    - name: Download OpenSSL LTS source
      uses: ./.github/actions/download-openssl
      with:
        openssl_version: ${{ env.OPENSSL_VERSION_LTS }}
        openssl_url: https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION_LTS }}/openssl-${{ env.OPENSSL_VERSION_LTS }}.tar.gz

    - name: Build & Install OpenSSL (Windows ARM64)
      shell: bash
      run: |
        set -euo pipefail
        # Git Bash prepends MSYS perl; OpenSSL VC-* targets need Strawberry Perl.
        export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
        perl -MLocale::Maketext::Simple -e '1' >/dev/null
        versions=("${{ env.OPENSSL_VERSION_CURRENT }}" "${{ env.OPENSSL_VERSION_LTS }}")
        for ver in "${versions[@]}"; do
          cd "openssl-${ver}"
          export CC=clang-cl
          perl Configure VC-WIN64-ARM no-shared no-legacy --release //MT \
            --prefix="${GITHUB_WORKSPACE}/install/${ver}/windows/arm64"
          nmake
          : > ossl_static.pdb
          nmake install_sw
          nmake clean
          cd ..
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libraries-windows-arm64
        path: install/**
        retention-days: 7

  build-libraries-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Clang/LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
        env: true

    - name: Setup cross-compilation environment
      uses: SpaceTravelCompany/My-Actions/setup-linux-cross@main

    - name: Download OpenSSL sources
      uses: ./.github/actions/download-openssl
      with:
        openssl_version: ${{ env.OPENSSL_VERSION_CURRENT }}
        openssl_url: https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION_CURRENT }}/openssl-${{ env.OPENSSL_VERSION_CURRENT }}.tar.gz

    - name: Download OpenSSL LTS source
      uses: ./.github/actions/download-openssl
      with:
        openssl_version: ${{ env.OPENSSL_VERSION_LTS }}
        openssl_url: https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION_LTS }}/openssl-${{ env.OPENSSL_VERSION_LTS }}.tar.gz

    - name: Build & Install OpenSSL (Linux)
      shell: bash
      run: |
        set -euo pipefail

        build_linux() {
          local ver="$1"
          local target="$2"
          local prefix="$3"
          local cflags="$4"
          cd "openssl-${ver}"
          ./Configure "${target}" no-shared no-legacy --release --prefix="${prefix}" CFLAGS="${cflags}"
          make -j"$(nproc)"
          make install_sw
          make clean
          cd ..
        }

        versions=("${{ env.OPENSSL_VERSION_CURRENT }}" "${{ env.OPENSSL_VERSION_LTS }}")
        for ver in "${versions[@]}"; do
          build_linux "${ver}" linux-x86_64 \
            "${GITHUB_WORKSPACE}/install/${ver}/linux/x86_64" \
            "--target=x86_64-linux-gnu"
          build_linux "${ver}" linux-aarch64 \
            "${GITHUB_WORKSPACE}/install/${ver}/linux/aarch64" \
            "--target=aarch64-linux-gnu"
          build_linux "${ver}" linux64-riscv64 \
            "${GITHUB_WORKSPACE}/install/${ver}/linux/riscv64" \
            "--target=riscv64-linux-gnu"
          build_linux "${ver}" linux-x86-latomic \
            "${GITHUB_WORKSPACE}/install/${ver}/linux/i686" \
            "--target=i686-linux-gnu"
          build_linux "${ver}" linux-armv4 \
            "${GITHUB_WORKSPACE}/install/${ver}/linux/armhf" \
            "--target=arm-linux-gnueabihf"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libraries-compiled-linux
        path: |
          install/**
        retention-days: 7

  build-libraries-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29
        add-to-path: false

    - name: Download OpenSSL sources
      uses: ./.github/actions/download-openssl
      with:
        openssl_version: ${{ env.OPENSSL_VERSION_CURRENT }}
        openssl_url: https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION_CURRENT }}/openssl-${{ env.OPENSSL_VERSION_CURRENT }}.tar.gz

    - name: Download OpenSSL LTS source
      uses: ./.github/actions/download-openssl
      with:
        openssl_version: ${{ env.OPENSSL_VERSION_LTS }}
        openssl_url: https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION_LTS }}/openssl-${{ env.OPENSSL_VERSION_LTS }}.tar.gz

    - name: Set NDK env
      run: |
        NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
        echo "NDK_TOOLCHAIN_ARGS=AR=$NDK_BIN/llvm-ar RANLIB=$NDK_BIN/llvm-ranlib STRIP=$NDK_BIN/llvm-strip" >> $GITHUB_ENV

    - name: Build & Install OpenSSL (Android)
      shell: bash
      run: |
        set -euo pipefail

        build_android() {
          local ver="$1"
          local target="$2"
          local prefix="$3"
          local cc="$4"
          cd "openssl-${ver}"
          ./Configure "${target}" no-shared no-legacy --release \
            --prefix="${prefix}" \
            CC="${cc}" \
            ${NDK_TOOLCHAIN_ARGS}
          make -j"$(nproc)"
          make install_sw
          make clean
          cd ..
        }

        versions=("${{ env.OPENSSL_VERSION_CURRENT }}" "${{ env.OPENSSL_VERSION_LTS }}")
        for ver in "${versions[@]}"; do
          build_android "${ver}" linux-generic64 \
            "${GITHUB_WORKSPACE}/install/${ver}/android/arm64-v8a" \
            "${NDK_BIN}/aarch64-linux-android35-clang"
          build_android "${ver}" linux-generic32 \
            "${GITHUB_WORKSPACE}/install/${ver}/android/armeabi-v7a" \
            "${NDK_BIN}/armv7a-linux-androideabi35-clang"
          build_android "${ver}" linux-generic64 \
            "${GITHUB_WORKSPACE}/install/${ver}/android/x86_64" \
            "${NDK_BIN}/x86_64-linux-android35-clang"
          build_android "${ver}" linux-generic32 \
            "${GITHUB_WORKSPACE}/install/${ver}/android/x86" \
            "${NDK_BIN}/i686-linux-android35-clang"
          build_android "${ver}" linux-generic64 \
            "${GITHUB_WORKSPACE}/install/${ver}/android/riscv64" \
            "${NDK_BIN}/riscv64-linux-android35-clang"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libraries-compiled-android
        path: |
          install/**
        retention-days: 7

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-libraries-linux, build-libraries-android, build-libraries-windows, build-libraries-windows-arm64]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Get version
      uses: actions/github-script@v7
      id: get-version
      with:
        script: |
          const version = context.ref.replace('refs/tags/v', '');
          core.setOutput('version', version);

    - name: Prepare release directory
      run: |
        mkdir -p release
        cp -r artifacts/libraries-compiled-linux/install/* release/
        cp -r artifacts/libraries-compiled-android/install/* release/
        cp -r artifacts/libraries-windows/install/* release/
        cp -r artifacts/libraries-windows-arm64/install/* release/

    - name: Create tar archive
      working-directory: release
      run: tar -czf ../libraries-${{ steps.get-version.outputs.version }}.tar.gz .

    - name: Create zip archive
      working-directory: release
      run: zip -r ../libraries-${{ steps.get-version.outputs.version }}.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v2.5.0
      with:
        files: |
          libraries-*.tar.gz
          libraries-*.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
